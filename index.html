<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Believe Me I Can Fly</title>
    
    <!-- MediaPipe Libraries for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b16;
            font-family: 'Courier New', Courier, monospace;
        }

        #webcam, #processing-canvas {
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
        }

        .code-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #d4d4d4;
            background: rgba(30, 30, 30, 0.85);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid #333;
            z-index: 10;
        }

        .code-overlay span.keyword { color: #c586c0; }
        .code-overlay span.variable { color: #9cdcfe; }
        .code-overlay span.string { color: #ce9178; }

        #play-prompt {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            z-index: 1000;
            border: 1px solid #444;
            transition: background 0.2s;
        }

        #play-prompt:hover {
            background: rgba(50, 50, 50, 0.9);
        }
    </style>
</head>
<body>

    <audio id="background-music" loop>
        <source src="believemeicanfly.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="play-prompt">🔊 Click to Play Music & Enable Camera</div>

    <video id="webcam" playsinline></video>
    <canvas id="processing-canvas"></canvas>
    <canvas id="canvas"></canvas>

    <div class="code-overlay">
        <div><span class="keyword">let</span> <span class="variable">lyricSequence</span> = [<span class="string">"believe"</span>, <span class="string">"me"</span>, <span class="string">"i"</span>, <span class="string">"can"</span>, <span class="string">"fly,"</span>, <span class="string">"PAUSE"</span>, <span class="string">"im"</span>, <span class="string">"singing..."</span>];</div>
        <div><span class="keyword">function</span> <span class="variable">emitWord</span>(hand) {</div>
        <div>&nbsp;&nbsp;particles.push(<span class="keyword">new</span> WordParticle(hand.x, hand.y));</div>
        <div>}</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const procCanvas = document.getElementById('processing-canvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        const videoElement = document.getElementById('webcam');
        const audio = document.getElementById('background-music');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            procCanvas.width = 90;
            procCanvas.height = 55;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const lyricSequence = ["believe", "me", "i", "can", "fly,", "PAUSE", "im", "singing", "in", "the", "sky"];
        let seqIndex = 0;
        let wordParticles = [];
        let stars = [];
        let lastSpawnTime = 0;
        let isPausedForTimer = false;
        let gestureStarted = false;
        let waitingForNextTrigger = false;

        const asciiChars = "@#&$%*+!?., ";

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vy = Math.random() * 1.5 + 0.5;
                this.size = Math.random() * 2 + 1;
                this.alpha = Math.random() * 0.7 + 0.3;
            }
            update() {
                this.y += this.vy;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) {
            stars.push(new Star());
        }

        class WordParticle {
            constructor(x, y, word) {
                this.word = word;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5 - 0.3;
                this.alpha = 1.0;
                this.decay = 0.012;
                this.size = 26;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.scale(-1, 1);
                ctx.font = `bold ${this.size}px 'Courier New', monospace`;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.alpha)})`;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 12;
                ctx.lineWidth = 4;
                ctx.strokeText(this.word, -this.x, this.y);
                ctx.fillText(this.word, -this.x, this.y);
                ctx.restore();
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                gestureStarted = true;

                if (!audio.paused && audio.duration && audio.currentTime < audio.duration / 2) {
                    if (isPausedForTimer || waitingForNextTrigger) return;

                    const landmarks = results.multiHandLandmarks[0];
                    const indexFingerTip = landmarks[8];

                    const handX = (1 - indexFingerTip.x) * canvas.width;
                    const handY = indexFingerTip.y * canvas.height;

                    const now = Date.now();
                    // Decreased interval to 150ms so words spit out much faster
                    if (now - lastSpawnTime > 150) { 
                        const currentItem = lyricSequence[seqIndex];

                        if (currentItem === "PAUSE") {
                            isPausedForTimer = true;
                            seqIndex++;
                            setTimeout(() => {
                                isPausedForTimer = false;
                            }, 700);
                        } else {
                            wordParticles.push(new WordParticle(handX, handY, currentItem));
                            seqIndex++;

                            if (seqIndex >= lyricSequence.length) {
                                waitingForNextTrigger = true;
                                seqIndex = 0;
                                setTimeout(() => {
                                    waitingForNextTrigger = false;
                                }, 2000);
                            }
                        }
                        
                        lastSpawnTime = now;
                    }
                }
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            if (videoElement.readyState >= 2) {
                ctx.save();
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                procCtx.drawImage(videoElement, 0, 0, procCanvas.width, procCanvas.height);
                const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height).data;

                ctx.save();
                ctx.font = '11px monospace';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';

                const cellWidth = canvas.width / procCanvas.width;
                const cellHeight = canvas.height / procCanvas.height;

                for (let y = 1; y < procCanvas.height - 1; y++) {
                    for (let x = 1; x < procCanvas.width - 1; x++) {
                        const offset = (y * procCanvas.width + x) * 4;
                        const r = imgData[offset];
                        const g = imgData[offset + 1];
                        const b = imgData[offset + 2];
                        const brightness = (r + g + b) / 3;

                        const rightOffset = (y * procCanvas.width + (x + 1)) * 4;
                        const downOffset = ((y + 1) * procCanvas.width + x) * 4;
                        const rightDiff = Math.abs(brightness - ((imgData[rightOffset] + imgData[rightOffset+1] + imgData[rightOffset+2]) / 3));
                        const downDiff = Math.abs(brightness - ((imgData[downOffset] + imgData[downOffset+1] + imgData[downOffset+2]) / 3));
                        
                        if ((rightDiff > 16 || downDiff > 16) && brightness < 210 && brightness > 30) {
                            const charIndex = Math.floor((brightness / 255) * (asciiChars.length - 1));
                            const char = asciiChars[charIndex];

                            if (char && char !== ' ') {
                                const drawX = x * cellWidth;
                                const drawY = y * cellHeight;
                                ctx.fillText(char, drawX, drawY);
                            }
                        }
                    }
                }
                ctx.restore();
            }
            
            if (gestureStarted) {
                wordParticles.forEach(p => p.update());
                wordParticles = wordParticles.filter(p => p.alpha > 0);
                wordParticles.forEach(p => p.draw());
            }

            requestAnimationFrame(animate);
        }

        animate();

        const prompt = document.getElementById('play-prompt');

        prompt.addEventListener('click', async () => {
            try {
                audio.play();
                
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280,
                    height: 720
                });
                await camera.start();

                prompt.style.display = 'none';
            } catch (err) {
                console.error("Error starting camera or audio:", err);
                prompt.innerText = "⚠️ Camera/Audio Blocked. Check Permissions.";
            }
        });
    </script>
</body>
</html>
