<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Believe Me I Can Fly</title>
    
    <!-- MediaPipe Libraries for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: 'Courier New', Courier, monospace;
        }

        #webcam {
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1); /* Mirror effect */
        }

        .code-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #d4d4d4;
            background: rgba(30, 30, 30, 0.85);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid #333;
            z-index: 10;
        }

        .code-overlay span.keyword { color: #c586c0; }
        .code-overlay span.variable { color: #9cdcfe; }
        .code-overlay span.string { color: #ce9178; }

        #play-prompt {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            z-index: 1000;
            border: 1px solid #444;
            transition: background 0.2s;
        }

        #play-prompt:hover {
            background: rgba(50, 50, 50, 0.9);
        }
    </style>
</head>
<body>

    <audio id="background-music" loop>
        <source src="believemeicanfly.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="play-prompt">🔊 Click to Play Music & Enable Camera</div>

    <video id="webcam" playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="code-overlay">
        <div><span class="keyword">let</span> <span class="variable">lyrics</span> = <span class="string">"Believe me I can fly, I'm singing in the sky"</span>;</div>
        <div><span class="keyword">function</span> <span class="variable">emit</span>(hand) {</div>
        <div>&nbsp;&nbsp;particles.push(<span class="keyword">new</span> Particle(hand.x, hand.y));</div>
        <div>}</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('webcam');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const lyricString = "Believe me I can fly, I'm singing in the sky";
        const characters = lyricString.split('');
        let charIndex = 0;
        let particles = [];
        let lastSpawnTime = 0;

        class Particle {
            constructor(x, y, char) {
                this.char = char;
                this.x = x;
                this.y = y;
                // Gentle outward burst velocity from the hand
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3 - 1; 
                this.rotation = Math.random() * Math.PI * 2;
                this.vRotation = (Math.random() - 0.5) * 0.08;
                this.size = Math.floor(Math.random() * 6) + 16;
                this.alpha = 1.0;
                this.decay = 0.015; // Fade out speed
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.vRotation;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px 'Courier New', monospace`;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.alpha)})`;
                ctx.fillText(this.char, 0, 0);
                ctx.restore();
            }
        }

        // Setup MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFingerTip = landmarks[8]; // Index finger tip landmark

                const handX = indexFingerTip.x * canvas.width;
                const handY = indexFingerTip.y * canvas.height;

                const now = Date.now();
                // Throttle emission so characters flow out sequentially instead of all at once
                if (now - lastSpawnTime > 70) { 
                    const nextChar = characters[charIndex];
                    particles.push(new Particle(handX, handY, nextChar));
                    
                    // Cycle through the lyric string sequentially
                    charIndex = (charIndex + 1) % characters.length;
                    lastSpawnTime = now;
                }
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw webcam background
            if (videoElement.readyState >= 2) {
                ctx.save();
                ctx.globalAlpha = 0.5;
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            
            // Update and draw particles, removing faded ones
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => p.draw());

            requestAnimationFrame(animate);
        }

        animate();

        // Audio & Camera Trigger Logic
        const audio = document.getElementById('background-music');
        const prompt = document.getElementById('play-prompt');

        prompt.addEventListener('click', async () => {
            try {
                audio.play();
                
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 1280,
                    height: 720
                });
                await camera.start();

                prompt.style.display = 'none';
            } catch (err) {
                console.error("Error starting camera or audio:", err);
                prompt.innerText = "⚠️ Camera/Audio Blocked. Check Permissions.";
            }
        });
    </script>
</body>
</html>
